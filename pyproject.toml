[project]
name = "agent-research-kit"
version = "0.1.0"
description = "A reproducible, AI-agent-ready template for academic and data-science research."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["research", "template", "reproducibility", "data-science", "machine-learning", "claude", "ai-agents"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.29"]
dev = ["ruff>=0.6", "pytest>=8.0", "pre-commit>=3.7", "nbstripout>=0.7"]

[project.urls]
Homepage = "https://github.com/tuandang304/agent-research-kit"
Repository = "https://github.com/tuandang304/agent-research-kit"
Issues = "https://github.com/tuandang304/agent-research-kit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ark"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "experiments", "tests"]
# Don't lint vendored Claude Code skills or generated artifacts.
extend-exclude = [".claude", ".agents", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
